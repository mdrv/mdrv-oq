[workspace]
members = ["crates/mdrv-oq-core"]
resolver = "2"

[package]
name = "mdrv-oq"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mdrv-oq-core = { path = "crates/mdrv-oq-core" }
nsh-core = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api", version = "0.6.1" }
nsh-base = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api", version = "0.6.1" }
env_logger = "0.11"
log = "0.4"
serde_json = "1"

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
nsh-platform-linux = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api", version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api", version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api", version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg", "net"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# The nsh crates come from the mdrv-oq/tray-api branch of the public
# fork (colored SVG tray icons on Linux/Windows; host_call exposed to
# apps for the Android key reveal). They are declared as Git
# dependencies, NOT via [patch.crates-io]: `nsh package` builds the app
# from a generated workspace of its own and only carries dependencies
# that are declared Git in the first place — a patch table in the app's
# manifest is invisible to it, so the generated workspace would resolve
# the registry versions and miss the fork (and every crate resolving to
# the same repository and revision shares one nsh-core, keeping the
# Component impl intact).
