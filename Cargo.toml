[workspace]
members = ["crates/mdrv-oq-core"]
resolver = "2"

[package]
name = "mdrv-oq"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mdrv-oq-core = { path = "crates/mdrv-oq-core" }
nsh-core = "0.6.0"
nsh-base = "0.6.0"
env_logger = "0.11"
serde_json = "1"

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "svg", "net"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# Colored SVG tray icons (upstream treats every SVG as a black/white
# panel-tinted template; fixed for Linux and Windows on the mdrv-oq/tray-api
# branch of the public fork). The whole nsh chain must be patched together:
# nsh's crates use workspace deps, so patching only the platform crate would
# create a second, distinct nsh-core and break the Component impl.
[patch.crates-io]
nsh-core = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api" }
nsh-base = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api" }
nsh-engine = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api" }
nsh-macros = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api" }
nsh-platform-linux = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api" }
nsh-platform-windows = { git = "https://github.com/mdrv/nsh", branch = "mdrv-oq/tray-api" }
