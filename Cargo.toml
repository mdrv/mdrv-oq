[workspace]
members = ["crates/mdrv-oq-core"]
resolver = "2"

[package]
name = "mdrv-oq"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mdrv-oq-core = { path = "crates/mdrv-oq-core" }
nsh-core = "0.6.0"
nsh-base = "0.6.0"
env_logger = "0.11"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

# Colored SVG tray icons (upstream treats every SVG as a black/white
# panel-tinted template); branch mdrv-oq/tray-api in the local clone.
# The whole nsh chain must be patched together: the clone's crates use
# workspace path deps, so patching only the platform crate would create
# a second, distinct nsh-core and break the Component impl.
[patch.crates-io]
nsh-core = { path = "/g/_ext/nsh/crates/nsh-core" }
nsh-base = { path = "/g/_ext/nsh/crates/nsh-base" }
nsh-engine = { path = "/g/_ext/nsh/crates/nsh-engine" }
nsh-macros = { path = "/g/_ext/nsh/crates/nsh-macros" }
nsh-platform-linux = { path = "/g/_ext/nsh/crates/nsh-platform-linux" }
