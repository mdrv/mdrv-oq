[package]
name = "mdrv-oq-core"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false
description = "GLM / Z.AI Coding Plan quota: fetch, parse, key resolution, thresholds, rendering"

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.43.0", features = ["bundled"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt"] }
turso = "0.8.3"
